<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Simulador Avanzado - Motor Asíncrono Trifásico</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        .main-container {
            width: 95%;
            max-width: 1200px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            display: flex;
            flex-direction: column;
            gap: 15px;
            position: relative;
        }
        h2.pdf-title {
            text-align: center;
            color: #333;
            margin-bottom: 2px;
            font-size: 20px;
        }
        p.subtitle {
            text-align: center;
            color: #666;
            font-size: 13px;
            margin-top: 0;
            margin-bottom: 10px;
        }
        .config-panel {
            background: #e9ecef;
            padding: 10px;
            border-radius: 6px;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
            gap: 10px;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            font-size: 12px;
            color: #333;
        }
        .input-group label {
            font-weight: bold;
            margin-bottom: 2px;
        }
        .input-group input {
            padding: 5px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
        }
        .content-layout {
            display: flex;
            flex-wrap: nowrap;
            gap: 15px;
            justify-content: space-between;
            align-items: flex-start;
        }
        .chart-container {
            flex: 2;
            width: 60%;
            height: 380px;
            position: relative;
        }
        .panel-container {
            flex: 1.2;
            width: 38% !important;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .controls-row {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        .controls-group {
            display: flex;
            gap: 8px;
        }
        .action-btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 6px 10px;
            font-size: 12px;
            border-radius: 5px;
            cursor: pointer;
            flex: 1;
            transition: background-color 0.3s ease;
        }
        .action-btn:hover {
            background-color: #0056b3;
        }
        .calc-values-btn {
            background-color: #17a2b8;
        }
        .calc-values-btn:hover {
            background-color: #138496;
        }
        .calc-chart-btn {
            background-color: #ffc107;
            color: #333;
            font-weight: bold;
        }
        .calc-chart-btn:hover {
            background-color: #e0a800;
        }
        .table-wrapper {
            max-height: 260px;
            overflow-y: auto;
            border: 1px solid #ddd;
            border-radius: 6px;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
            font-size: 12px;
        }
        th, td {
            padding: 6px;
            border-bottom: 1px solid #ddd;
        }
        th {
            background-color: #343a40;
            color: white;
            position: sticky;
            top: 0;
        }
        input.s-input {
            width: 65px;
            padding: 3px;
            font-size: 12px;
        }
        .delete-btn {
            background-color: #dc3545;
            color: white;
            border: none;
            padding: 2px 5px;
            border-radius: 3px;
            cursor: pointer;
        }
        .delete-btn:hover {
            background-color: #c82333;
        }
        .signature {
            text-align: right;
            font-size: 12px;
            font-weight: bold;
            color: #555;
            margin-top: 5px;
            font-family: monospace;
        }
        .btn-container {
            text-align: center;
            margin-top: 10px;
        }
        .download-btn {
            background-color: #28a745;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        .download-btn:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>

<div class="main-container" id="pdf-container">
    <h2 class="pdf-title">Simulador de Motor Asíncrono Trifásico</h2>
    <p class="subtitle">Par Electromagnético y Potencia Mecánica vs Deslizamiento</p>
    
    <div class="config-panel">
        <div class="input-group">
            <label>Tensión Línea (V_L):</label>
            <input type="number" id="vLine" placeholder="Ej. 380" step="any">
        </div>
        <div class="input-group">
            <label>Frecuencia (f en Hz):</label>
            <input type="number" id="freq" placeholder="Ej. 50" step="any">
        </div>
        <div class="input-group">
            <label>Número de Polos:</label>
            <input type="number" id="poles" placeholder="Ej. 10" step="1">
        </div>
        <div class="input-group">
            <label>Resistencia R₁ (&Omega;):</label>
            <input type="number" id="r1" placeholder="Ej. 0.5" step="any">
        </div>
        <div class="input-group">
            <label>Reactancia X₁ (&Omega;):</label>
            <input type="number" id="x1" placeholder="Ej. 3.0" step="any">
        </div>
        <div class="input-group">
            <label>Resistencia R₂' (&Omega;):</label>
            <input type="number" id="r2Prime" placeholder="Ej. 0.8" step="any">
        </div>
        <div class="input-group">
            <label>Reactancia X₂' (&Omega;):</label>
            <input type="number" id="x2Prime" placeholder="Ej. 3.5" step="any">
        </div>
    </div>

    <div class="content-layout">
        <div class="chart-container">
            <canvas id="dualChart"></canvas>
        </div>

        <div class="panel-container">
            <div class="controls-row">
                <button class="action-btn" id="addRowBtn">+ Agregar Deslizamiento</button>
                <div class="controls-group">
                    <button class="action-btn calc-values-btn" id="calcValuesBtn">Calcular Torque y Potencia</button>
                    <button class="action-btn calc-chart-btn" id="calcChartBtn">Calcular Gráfica</button>
                </div>
            </div>
            <div class="table-wrapper">
                <table id="resultsTable">
                    <thead>
                        <tr>
                            <th>s (%)</th>
                            <th>Torque (N·m)</th>
                            <th>Pot. (W)</th>
                            <th>Acción</th>
                        </tr>
                    </thead>
                    <tbody id="tableBody">
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Firma en la parte derecha inferior -->
    <div class="signature">ALEJANDRO REYES</div>
</div>

<div class="btn-container">
    <button class="download-btn" id="downloadPdfBtn">Descargar PDF</button>
</div>

<script>
    const tableBody = document.getElementById('tableBody');

    function obtenerParametros() {
        const V_line = parseFloat(document.getElementById('vLine').value) || 380;
        const f = parseFloat(document.getElementById('freq').value) || 50;
        const poles = parseInt(document.getElementById('poles').value) || 10;
        const R1 = document.getElementById('r1').value !== '' ? parseFloat(document.getElementById('r1').value) : 0.5;
        const X1 = document.getElementById('x1').value !== '' ? parseFloat(document.getElementById('x1').value) : 3.0;
        const R2_prime = document.getElementById('r2Prime').value !== '' ? parseFloat(document.getElementById('r2Prime').value) : 0.8;
        const X2_prime = document.getElementById('x2Prime').value !== '' ? parseFloat(document.getElementById('x2Prime').value) : 3.5;

        const V1 = V_line / Math.sqrt(3);
        const n_s = (120 * f) / poles; 
        const Omega_s = (2 * Math.PI * n_s) / 60; 
        const Xt = X1 + X2_prime;

        return { V1, n_s, Omega_s, R1, R2_prime, Xt };
    }

    function calcularPar(s, p) {
        if (s <= 0 || p.Omega_s === 0 || p.V1 === 0) return 0;
        const termR = p.R2_prime / s;
        const numerador = 3 * Math.pow(p.V1, 2) * termR;
        const denominador = p.Omega_s * (Math.pow(p.R1 + termR, 2) + Math.pow(p.Xt, 2));
        return numerador / denominador;
    }

    function calcularPotenciaMecanica(s, p) {
        if (s <= 0 || p.V1 === 0) return 0;
        const termR = p.R2_prime / s;
        const denom = Math.pow(p.R1 + termR, 2) + Math.pow(p.Xt, 2);
        if (denom === 0) return 0;
        const I2_sq = Math.pow(p.V1, 2) / denom;
        return 3 * p.R2_prime * ((1 / s) - 1) * I2_sq;
    }

    function agregarFila(valPorc = '') {
        const row = document.createElement('tr');
        row.innerHTML = `
            <td><input type="number" step="any" class="s-input" value="${valPorc}" placeholder="Ej. 4"></td>
            <td class="res-torque">-</td>
            <td class="res-potencia">-</td>
            <td><button class="delete-btn" onclick="this.closest('tr').remove()">X</button></td>
        `;
        tableBody.appendChild(row);
    }

    document.getElementById('addRowBtn').addEventListener('click', () => {
        agregarFila();
    });

    const ctx = document.getElementById('dualChart').getContext('2d');
    
    const dualChart = new Chart(ctx, {
        type: 'line',
        data: {
            datasets: [
                {
                    label: 'Par Teórico (N·m)',
                    data: [],
                    borderColor: 'rgba(54, 162, 235, 0.4)',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1,
                    yAxisID: 'y',
                    order: 3
                },
                {
                    label: 'Potencia Teórica (W)',
                    data: [],
                    borderColor: 'rgba(255, 159, 64, 0.4)',
                    borderWidth: 1.5,
                    pointRadius: 0,
                    tension: 0.1,
                    yAxisID: 'y1',
                    order: 4
                },
                {
                    label: 'Puntos Par (Tabla)',
                    data: [],
                    borderColor: 'rgba(54, 162, 235, 1)',
                    backgroundColor: 'rgba(54, 162, 235, 1)',
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    type: 'scatter',
                    yAxisID: 'y',
                    order: 1
                },
                {
                    label: 'Puntos Potencia (Tabla)',
                    data: [],
                    borderColor: 'rgba(255, 99, 132, 1)',
                    backgroundColor: 'rgba(255, 99, 132, 1)',
                    pointRadius: 5,
                    pointHoverRadius: 8,
                    type: 'scatter',
                    yAxisID: 'y1',
                    order: 2
                }
            ]
        },
        options: {
            responsive: true,
            maintainAspectRatio: false,
            scales: {
                x: {
                    type: 'linear',
                    reverse: true,
                    title: { display: true, text: 'Deslizamiento (s)' },
                    min: 0,
                    max: 1.0
                },
                y: {
                    type: 'linear',
                    position: 'left',
                    title: { display: true, text: 'Par (N·m)' },
                    beginAtZero: true
                },
                y1: {
                    type: 'linear',
                    position: 'right',
                    title: { display: true, text: 'Potencia Mecánica (W)' },
                    beginAtZero: true,
                    grid: { drawOnChartArea: false }
                }
            }
        }
    });

    document.getElementById('calcValuesBtn').addEventListener('click', () => {
        const p = obtenerParametros();
        const rows = tableBody.querySelectorAll('tr');
        rows.forEach(row => {
            const input = row.querySelector('.s-input');
            const tdTorque = row.querySelector('.res-torque');
            const tdPotencia = row.querySelector('.res-potencia');
            
            const sPorc = parseFloat(input.value);
            if (!isNaN(sPorc) && sPorc > 0) {
                const sDec = sPorc / 100;
                tdTorque.textContent = calcularPar(sDec, p).toFixed(2);
                tdPotencia.textContent = calcularPotenciaMecanica(sDec, p).toFixed(1);
            } else {
                tdTorque.textContent = '-';
                tdPotencia.textContent = '-';
            }
        });
    });

    document.getElementById('calcChartBtn').addEventListener('click', () => {
        const p = obtenerParametros();
        const rows = tableBody.querySelectorAll('tr');
        const puntosTorque = [];
        const puntosPotencia = [];

        rows.forEach(row => {
            const input = row.querySelector('.s-input');
            const tdTorque = row.querySelector('.res-torque');
            const tdPotencia = row.querySelector('.res-potencia');
            
            const sPorc = parseFloat(input.value);
            if (!isNaN(sPorc) && sPorc > 0) {
                const sDec = sPorc / 100;
                const tVal = calcularPar(sDec, p);
                const pVal = calcularPotenciaMecanica(sDec, p);
                
                tdTorque.textContent = tVal.toFixed(2);
                tdPotencia.textContent = pVal.toFixed(1);

                puntosTorque.push({ x: sDec, y: tVal });
                puntosPotencia.push({ x: sDec, y: pVal });
            }
        });

        const sCurva = [];
        const tCurva = [];
        const pCurva = [];
        for (let s = 0.0005; s <= 0.15; s += 0.001) {
            let valS = Number(s.toFixed(4));
            sCurva.push(valS);
            tCurva.push(calcularPar(valS, p));
            pCurva.push(calcularPotenciaMecanica(valS, p));
        }
        for (let s = 0.20; s <= 1.0; s += 0.02) {
            let valS = Number(s.toFixed(2));
            sCurva.push(valS);
            tCurva.push(calcularPar(valS, p));
            pCurva.push(calcularPotenciaMecanica(valS, p));
        }

        dualChart.data.datasets[0].data = sCurva.map((s, i) => ({ x: s, y: tCurva[i] }));
        dualChart.data.datasets[1].data = sCurva.map((s, i) => ({ x: s, y: pCurva[i] }));
        dualChart.data.datasets[2].data = puntosTorque;
        dualChart.data.datasets[3].data = puntosPotencia;
        dualChart.update();
    });

    agregarFila();

    document.getElementById('downloadPdfBtn').addEventListener('click', function() {
        const element = document.getElementById('pdf-container');
        const options = {
            margin:       [5, 5, 5, 5],
            filename:     'simulador_motor_asincrono.pdf',
            image:        { type: 'jpeg', quality: 0.98 },
            html2canvas:  { scale: 2, useCORS: true, letterRendering: true },
            jsPDF:        { unit: 'mm', format: 'a4', orientation: 'landscape' }
        };
        html2pdf().from(element).set(options).save();
    });
</script>

</body>
</html>
